[tool.poetry]
name = "chainledger-core"
version = "0.1.0"
description = "Neutral, read-only on-chain data over public BigQuery datasets."
authors = ["Oculix LLC"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/oculix-ai/chainledger-core"
repository = "https://github.com/oculix-ai/chainledger-core"
keywords = ["ethereum", "blockchain", "bigquery", "on-chain-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
packages = [{ include = "chainledger_core", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
google-cloud-bigquery = "^3.25.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
